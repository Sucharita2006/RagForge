[project]
name = "ragforge-backend"
version = "0.1.0"
description = "ragforge backend — trustworthy, self-improving RAG platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-api>=1.28",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.3",
    "docling>=2.15",
    "pypdf>=5.1",
    # Not on PyPI under this name (that name is squatted by an unrelated
    # package) - installed straight from the upstream repo, pinned to a
    # commit for reproducibility (implementation-plan.md §3: RoBERTa-Large
    # variant, ~1.4GB, lazy-loaded in the worker).
    "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@b58b9fa69acbd1015ec970fa65dd752413a053d2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Runtime artifacts, not source: uploaded documents and fine-tuned model
# directories (whose auto-generated model cards contain code blocks ruff
# would otherwise try to reformat). Already gitignored; excluded here so a
# training run can't make `ruff format --check` fail.
extend-exclude = ["data/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Form()/Query() in argument defaults is the correct,
# idiomatic pattern, not the mutable-default-argument bug B008 flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
